name: Build APK

on:
  push:
    branches: [fake-gps-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5
          cache-disabled: true
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > MockGpsShizuku/local.properties
          echo "sdk.dir=$ANDROID_HOME" > AmiMockGps/local.properties
      - name: Build MockGpsShizuku
        working-directory: ./MockGpsShizuku
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Build AmiMockGps
        working-directory: ./AmiMockGps
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APKs
        run: |
          cp MockGpsShizuku/app/build/outputs/apk/debug/app-debug.apk MockGpsShizuku.apk
          cp AmiMockGps/app/build/outputs/apk/debug/app-debug.apk AmiMockGps.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fake-gps-apks
          path: |
            MockGpsShizuku.apk
            AmiMockGps.apk
